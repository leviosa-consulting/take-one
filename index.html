<meta charset="utf-8">
<title>Take One</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Courier+Prime:wght@400;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<div class="top">
  <div class="top-in">
    <div class="brand"><span class="mark" aria-hidden="true"></span><h1>Take One</h1></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-learn" aria-selected="true" aria-controls="view-learn">Learn</button>
      <button role="tab" id="tab-coverage" aria-selected="false" aria-controls="view-coverage">Coverage</button>
      <button role="tab" id="tab-list" aria-selected="false" aria-controls="view-list">Shot list</button>
    </div>
    <div class="top-right">
      <select class="ctl" id="film-select" aria-label="Film"></select>
      <button class="btn" id="new-film">New film</button>
      <span class="pill" id="save-pill">Loading</span>
    </div>
  </div>
</div>

<main class="wrap">
  <div id="view-learn" role="tabpanel"></div>
  <div id="view-coverage" role="tabpanel" hidden></div>
  <div id="view-list" role="tabpanel" hidden></div>
</main>
<div class="toast" id="toast" hidden role="status"></div>
<script src="js/data.js"></script>
<script src="js/drawings.js"></script>
<script src="js/stage.js"></script>
<script src="js/continuity.js"></script>
<script src="js/learn.js"></script>
<script src="js/storage.js"></script>
<script src="js/account.js"></script>
<script src="js/list.js"></script>
<script src="js/coverage.js"></script>
<script src="js/app.js"></script>
