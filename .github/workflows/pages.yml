name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # index.html is written for the artifact host, which adds the doctype and the rest of the head.
      # Add them here so the page renders in standards mode as a plain website.
      - name: Build site
        run: |
          mkdir _site
          cp -r css js _site/
          {
            printf '<!doctype html>\n<html lang="en">\n'
            printf '<meta name="viewport" content="width=device-width, initial-scale=1">\n'
            cat index.html
          } > _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
